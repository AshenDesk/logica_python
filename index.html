<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lógica de Programação com Python — Guia Interativo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14161C; --ink-soft:#4A5163; --ink-faint:#7C8494;
    --paper:#E9F0F7; --surface:#FFFFFF;
    --console:#1C2A3A; --console-soft:#25384B; --console-line:#33475D;
    --console-text:#9FB2C6; --console-text-dim:#5E7188;
    --blue:#2F6F9E; --blue-deep:#1F4E70; --blue-pale:#DCEAF5;
    --gold:#E3A324; --gold-deep:#B87F13; --gold-pale:#FBE9C6;
    --success:#1F9D6C; --success-pale:#DBF3E7;
    --danger:#DC4C41; --danger-pale:#FBE0DD;
    --border:#D3DDE7;
    --radius:18px; --radius-sm:11px;
    --font-display:'Space Grotesk','Segoe UI',system-ui,sans-serif;
    --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
    --font-mono:'IBM Plex Mono','Consolas','Monaco',monospace;
    --shadow-sm:0 1px 2px rgba(20,22,28,.06), 0 1px 1px rgba(20,22,28,.04);
    --shadow-md:0 6px 20px rgba(20,22,28,.09);
    --shadow-lg:0 20px 48px rgba(20,22,28,.16);
    --tok-comment:#8393A8; --tok-string:#E3A324; --tok-keyword:#B392F0; --tok-builtin:#5FC9A8; --tok-number:#F0A868; --tok-default:#DCE6F0;
  }
  body.theme-dark{
    --ink:#3CFF6E; --ink-soft:#2ED659; --ink-faint:#1E9E43;
    --paper:#040A04; --surface:#08130A;
    --console:#000000; --console-soft:#081208; --console-line:#123317;
    --console-text:#5EDD86; --console-text-dim:#2E8F4E;
    --blue:#3CFF6E; --blue-deep:#25C955; --blue-pale:#0E2414;
    --gold:#B6FF3D; --gold-deep:#8FE01F; --gold-pale:#182B0A;
    --success:#43FF7A; --success-pale:#0D2A15;
    --danger:#FF5C5C; --danger-pale:#2A0D0D;
    --border:#1B4423;
    --font-display:'VT323','Courier New',monospace;
    --font-body:'Share Tech Mono','Courier New',monospace;
    --font-mono:'Share Tech Mono','Courier New',monospace;
    --shadow-sm:0 0 0 1px rgba(60,255,110,.08);
    --shadow-md:0 0 24px rgba(60,255,110,.10);
    --shadow-lg:0 0 48px rgba(60,255,110,.14);
    --tok-comment:#238C48; --tok-string:#B6FF3D; --tok-keyword:#43FF7A; --tok-builtin:#8CFFB0; --tok-number:#6DFF9C; --tok-default:#2ED659;
  }
  body.theme-dark *{ transition:background-color .25s ease, border-color .25s ease, color .25s ease; }
  body.theme-dark h1,
  body.theme-dark .brand-text,
  body.theme-dark .btn-primary,
  body.theme-dark .btn-secondary,
  body.theme-dark .btn-ghost{ letter-spacing:.02em; }
  body.theme-dark .hero h1{ font-size:40px; }
  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  html{ max-width:100%; }
  body{
    background:
      radial-gradient(1100px 480px at 90% -10%, var(--blue-pale) 0%, transparent 60%),
      radial-gradient(900px 400px at -10% 0%, var(--gold-pale) 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    max-width:100%;
    overflow-wrap:break-word;
    word-break:break-word;
  }
  h1,h2,h3{ font-family:var(--font-display); color:var(--ink); margin:0 0 .5em; letter-spacing:-.01em; }
  p{ margin:0 0 1em; color:var(--ink-soft); }
  button{ font-family:inherit; }
  button:focus-visible, a:focus-visible{ outline:3px solid var(--blue); outline-offset:2px; border-radius:6px; }
  ::selection{ background:var(--gold-pale); }

  /* ---------- Loading ---------- */
  .loading-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; }
  .loading-glyph{ font-family:var(--font-mono); font-size:15px; color:var(--ink-faint); }
  .loading-dots::after{ content:''; display:inline-block; width:1em; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots{ 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

  /* ---------- Header ---------- */
  .app-header{
    display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:20px;
    padding:16px 28px; background:rgba(255,255,255,.72); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border); position:sticky; top:0; z-index:40;
  }
  body.theme-dark .app-header{ background:rgba(4,10,4,.82); border-bottom-color:var(--border); }
  .brand{ display:flex; align-items:center; gap:10px; cursor:pointer; border:none; background:none; padding:2px; grid-column:1; }
  .brand-icon{ font-size:22px; }
  .brand-text{ font-family:var(--font-mono); font-weight:600; font-size:15px; color:var(--ink); }
  .brand-ext{ color:var(--gold-deep); }
  .xp-readout{ display:flex; align-items:center; gap:10px; grid-column:2; min-width:0; max-width:440px; }
  .xp-level{ font-family:var(--font-mono); font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .xp-bar-track{ flex:1; height:9px; background:var(--border); border-radius:5px; overflow:hidden; min-width:50px; }
  .xp-bar-fill{ height:100%; background:linear-gradient(90deg, var(--gold-deep), var(--gold)); border-radius:5px; transition:width .5s ease; }
  .xp-value{ font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--gold-deep); white-space:nowrap; }
  .header-actions{ grid-column:3; display:flex; align-items:center; gap:8px; }
  .reset-btn{ border:1px solid var(--border); background:var(--surface); color:var(--ink-faint); width:38px; height:38px; border-radius:50%; cursor:pointer; font-size:16px; transition:.15s; flex-shrink:0; }
  .reset-btn:hover{ color:var(--danger); border-color:var(--danger); transform:rotate(-40deg); }
  .theme-toggle-btn:hover{ color:var(--gold-deep); border-color:var(--gold-deep); transform:rotate(0); }

  /* ---------- Layout shell ---------- */
  .content-shell{ display:flex; gap:24px; max-width:1160px; margin:0 auto; padding:28px 28px 80px; align-items:flex-start; overflow-x:hidden; width:100%; }
  .content-shell-focus{ flex-direction:column; max-width:760px; }
  .content-main{ flex:1; min-width:0; max-width:100%; display:flex; flex-direction:column; gap:22px; }

  /* ---------- Module rail ---------- */
  .module-rail{ width:250px; max-width:100%; min-width:0; flex-shrink:0; display:flex; flex-direction:column; gap:6px; position:sticky; top:88px; }
  .rail-item{
    display:flex; align-items:center; gap:10px; text-align:left; width:100%;
    padding:10px 12px; border-radius:var(--radius-sm); border:1px solid transparent;
    background:transparent; cursor:pointer; color:var(--ink-soft); font-size:13.5px;
    transition:.15s;
  }
  .rail-item:hover{ background:var(--surface); border-color:var(--border); }
  .rail-item-active{ background:var(--surface); border-color:var(--blue); box-shadow:var(--shadow-sm); color:var(--ink); font-weight:600; }
  .rail-num{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); width:18px; flex-shrink:0; }
  .rail-icon{ flex-shrink:0; }
  .rail-title{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail-status{ flex-shrink:0; font-size:12px; }
  .rail-item-done .rail-status{ color:var(--success); }
  .rail-item-locked{ opacity:.5; cursor:not-allowed; }
  .rail-item-exam{ margin-top:8px; border-top:1px dashed var(--border); padding-top:14px; }

  /* ---------- Panels / terminal chrome ---------- */
  .panel{ background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow-md); overflow:hidden; border:1px solid var(--border); min-width:0; max-width:100%; }
  .panel-chrome{ display:flex; align-items:center; gap:7px; padding:11px 16px; background:var(--console); }
  .dot{ width:9px; height:9px; border-radius:50%; background:var(--console-line); }
  .dot-r{ background:#E5786D; } .dot-y{ background:#E8C468; } .dot-g{ background:#7EC99B; }
  .chrome-path{ font-family:var(--font-mono); font-size:12px; color:var(--console-text); margin-left:8px; }
  .chrome-action{ margin-left:auto; background:transparent; border:1px solid rgba(255,255,255,.18); color:var(--console-text); cursor:pointer; font-size:12px; padding:5px 10px; border-radius:999px; transition:.15s; }
  .chrome-action:hover{ background:rgba(255,255,255,.14); color:#fff; border-color:rgba(255,255,255,.3); }
  .panel-body{ padding:30px 32px; }
  @media (max-width:600px){
    .panel-body{ padding:22px 18px; }
    .exercise-body{ padding:20px 16px; }
    .quiz-panel{ padding:20px 16px; }
    .code-block{ padding:14px 16px; font-size:12.5px; }
  }
  @media (max-width:380px){
    .panel-body{ padding:18px 14px; }
    .exercise-body{ padding:16px 12px; }
    .quiz-panel{ padding:16px 12px; }
  }

  /* ---------- Hero ---------- */
  .hero{ padding:6px 4px 4px; }
  .hero-eyebrow{ font-family:var(--font-mono); font-size:12px; letter-spacing:.14em; color:var(--blue-deep); margin:0 0 10px; font-weight:600; }
  .hero h1{ font-size:34px; margin-bottom:12px; }
  .hero-lead{ font-size:16px; max-width:60ch; }
  .hero-progress{ display:flex; align-items:center; gap:12px; margin:18px 0 20px; flex-wrap:wrap; }
  .hero-progress-track{ width:200px; height:8px; background:var(--border); border-radius:5px; overflow:hidden; }
  .hero-progress-fill{ height:100%; background:linear-gradient(90deg,var(--blue-deep),var(--blue)); transition:width .5s ease; }
  .hero-progress span{ font-family:var(--font-mono); font-size:12.5px; color:var(--ink-soft); }

  /* ---------- Buttons ---------- */
  .btn-primary, .btn-secondary, .btn-ghost{
    font-weight:600; border-radius:999px; cursor:pointer; border:none; transition:.15s;
    padding:12px 22px; font-size:14.5px; min-height:44px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{ background:var(--blue-deep); color:#fff; box-shadow:var(--shadow-sm); }
  .btn-primary:hover:not(:disabled){ background:var(--blue); transform:translateY(-1px); box-shadow:var(--shadow-md); }
  .btn-primary:disabled{ background:var(--border); color:var(--ink-faint); cursor:not-allowed; }
  .btn-large{ padding:15px 30px; font-size:15.5px; }
  .btn-secondary{ background:var(--gold-pale); color:var(--gold-deep); }
  .btn-secondary:hover{ background:var(--gold); color:#fff; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid var(--border); }
  .btn-ghost:hover{ border-color:var(--ink-faint); color:var(--ink); }

  /* ---------- Module cards (home grid) ---------- */
  .modules-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; }
  .module-card{
    text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 20px; cursor:pointer; display:flex; flex-direction:column; gap:4px; transition:.15s; position:relative;
  }
  .module-card:hover{ box-shadow:var(--shadow-md); transform:translateY(-2px); border-color:var(--blue); }
  .module-card-done{ background:var(--success-pale); }
  .module-card-top{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .module-card-num{ font-family:var(--font-mono); font-size:11px; color:var(--ink-faint); }
  .module-card-icon{ font-size:20px; }
  .module-card-check{ margin-left:auto; color:var(--success); font-weight:700; }
  .module-card h3{ font-size:15.5px; margin-bottom:2px; }
  .module-card p{ font-size:13px; margin-bottom:2px; }
  .module-card-score{ font-family:var(--font-mono); font-size:11.5px; color:var(--blue-deep); margin-top:6px; }

  .exam-cta{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; background:linear-gradient(120deg,var(--console),var(--console-soft)); border-radius:var(--radius); padding:22px 26px; color:#fff; }
  .exam-cta h3{ color:#fff; font-size:18px; }
  .exam-cta p{ color:#B9C7D6; margin:0; max-width:48ch; font-size:13.5px; }
  .exam-cta-locked{ opacity:.75; }
  .exam-cta .btn-primary{ background:var(--gold); color:var(--console); flex-shrink:0; }
  .exam-cta .btn-primary:hover:not(:disabled){ background:var(--gold-deep); color:#fff; }
  .exam-cta .btn-primary:disabled{ background:rgba(255,255,255,.15); color:#8797A9; }

  /* ---------- Theory / typography ---------- */
  .module-eyebrow{ font-family:var(--font-mono); font-size:11.5px; letter-spacing:.12em; color:var(--ink-faint); margin-bottom:6px; }
  .panel-body h1{ font-size:26px; margin-bottom:18px; }
  .theory p{ font-size:15.5px; }
  .theory strong{ color:var(--ink); }

  /* ---------- Code blocks ---------- */
  .code-block{
    background:var(--console); color:var(--tok-default); font-family:var(--font-mono); font-size:13.5px;
    padding:18px 20px; border-radius:var(--radius-sm); overflow-x:auto; margin:14px 0 20px; line-height:1.65;
    white-space:pre; max-width:100%; -webkit-overflow-scrolling:touch;
  }
  .tok-comment{ color:var(--tok-comment); font-style:italic; }
  .tok-string{ color:var(--tok-string); }
  .tok-keyword{ color:var(--tok-keyword); font-weight:600; }
  .tok-builtin{ color:var(--tok-builtin); }
  .tok-number{ color:var(--tok-number); }

  /* ---------- Exercise / quiz shared ---------- */
  .exercise-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; min-width:0; max-width:100%; }
  .exercise-body{ padding:26px 28px; }
  .exercise-body h3{ font-size:16.5px; margin-bottom:10px; }
  .exercise-instructions{ font-size:14.5px; }
  .exercise-question{ font-size:15px; font-weight:600; color:var(--ink); margin:14px 0 12px; }

  .chip{
    background:var(--blue-pale); color:var(--blue-deep); border:1px solid transparent; border-radius:999px;
    padding:9px 16px; font-size:13.5px; cursor:pointer; margin:0 8px 8px 0; transition:.15s; font-weight:500;
  }
  .chip:hover:not(:disabled){ background:var(--blue-deep); color:#fff; }
  .chip:disabled{ opacity:.35; cursor:not-allowed; }
  .chip-mono{ font-family:var(--font-mono); }
  .order-pool, .word-bank{ margin:14px 0; }
  .order-target{ display:flex; flex-direction:column; gap:8px; min-height:56px; padding:16px; background:var(--paper); border:1.5px dashed var(--border); border-radius:var(--radius-sm); margin-bottom:14px; }
  .placeholder-text{ color:var(--ink-faint); font-size:13.5px; margin:0; }
  .placed-chip{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 14px; font-size:13.5px; cursor:pointer; }
  .placed-chip.correct{ background:var(--success-pale); border-color:var(--success); }
  .placed-chip.incorrect{ background:var(--danger-pale); border-color:var(--danger); }

  .blank-slot{ display:inline-block; min-width:64px; padding:2px 10px; margin:0 2px; border-bottom:2px solid var(--gold); border-radius:4px; color:#fff; font-weight:600; text-align:center; }
  .blank-slot.filled{ background:rgba(255,255,255,.12); }
  .blank-slot.correct{ border-color:var(--success); background:rgba(31,157,108,.25); }
  .blank-slot.incorrect{ border-color:var(--danger); background:rgba(220,76,65,.25); }

  .options-list{ display:flex; flex-direction:column; gap:9px; }
  .option-btn{
    text-align:left; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-sm);
    padding:13px 16px; font-size:14.5px; cursor:pointer; color:var(--ink); transition:.15s;
  }
  .option-btn:hover:not(:disabled){ border-color:var(--blue); background:var(--blue-pale); }
  .option-btn.selected{ border-color:var(--blue); background:var(--blue-pale); }
  .option-btn.correct{ border-color:var(--success); background:var(--success-pale); font-weight:600; }
  .option-btn.incorrect{ border-color:var(--danger); background:var(--danger-pale); }
  .option-btn:disabled{ cursor:default; }

  .code-editor{ background:var(--console); border-radius:var(--radius-sm); overflow-x:auto; margin:6px 0 18px; max-width:100%; -webkit-overflow-scrolling:touch; }
  .code-line-clickable{ display:flex; gap:14px; padding:9px 18px; cursor:pointer; border-bottom:1px solid var(--console-line); transition:.15s; }
  .code-line-clickable:last-child{ border-bottom:none; }
  .code-line-clickable:hover{ background:var(--console-soft); }
  .code-line-clickable.correct{ background:rgba(31,157,108,.25); }
  .code-line-clickable.incorrect{ background:rgba(220,76,65,.25); }
  .code-line-clickable.selected{ background:var(--console-soft); }
  .line-num{ font-family:var(--font-mono); font-size:12px; color:var(--console-text-dim); width:16px; flex-shrink:0; user-select:none; }
  .line-code{ font-family:var(--font-mono); font-size:13.5px; color:var(--tok-default); white-space:pre; }

  /* ---------- Codebuild / indentation exercises ---------- */
  .codebuild-rows{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .codebuild-row{
    display:flex; align-items:center; gap:10px; background:var(--console); border-radius:var(--radius-sm);
    padding:8px 12px; flex-wrap:wrap;
  }
  .codebuild-row.correct{ box-shadow:inset 0 0 0 1.5px var(--success); }
  .codebuild-row.incorrect{ box-shadow:inset 0 0 0 1.5px var(--danger); }
  .codebuild-pos{ font-family:var(--font-mono); font-size:11.5px; color:var(--console-text-dim); width:18px; flex-shrink:0; }
  .codebuild-text{ font-family:var(--font-mono); font-size:13px; color:var(--tok-default); white-space:pre; cursor:pointer; }
  .indent-controls{ display:flex; gap:4px; flex-shrink:0; }
  .indent-btn{
    font-family:var(--font-mono); font-size:11.5px; width:24px; height:24px; border-radius:6px; cursor:pointer;
    border:1px solid rgba(255,255,255,.18); background:transparent; color:var(--console-text); transition:.15s;
  }
  .indent-btn:hover:not(:disabled){ border-color:var(--gold); color:var(--gold); }
  .indent-btn.active{ background:var(--gold); border-color:var(--gold); color:var(--console); font-weight:700; }
  .indent-btn:disabled{ cursor:default; opacity:.6; }
  .codebuild-preview{ margin-top:4px; }
  .codebuild-hint{ font-size:12.5px; color:var(--ink-faint); margin:-6px 0 12px; }

  .exercise-actions{ display:flex; gap:10px; margin:6px 0 4px; flex-wrap:wrap; }
  .feedback{ margin-top:16px; padding:16px 18px; border-radius:var(--radius-sm); }
  .feedback-correct{ background:var(--success-pale); }
  .feedback-incorrect{ background:var(--danger-pale); }
  .feedback strong{ display:block; margin-bottom:4px; color:var(--ink); }
  .feedback p{ margin:0 0 10px; font-size:13.5px; color:var(--ink-soft); }

  /* ---------- Quiz ---------- */
  .quiz-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:26px 28px; overflow:hidden; min-width:0; max-width:100%; }
  .quiz-panel h3{ font-size:16.5px; margin-bottom:16px; }
  .quiz-panel-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .quiz-panel-head h3{ margin-bottom:0; }
  .btn-small{ padding:8px 14px; font-size:12.5px; min-height:auto; }
  .quiz-question{ padding:16px 0; border-top:1px solid var(--border); }
  .quiz-question:first-of-type{ border-top:none; padding-top:0; }
  .quiz-q-text{ font-weight:600; color:var(--ink); font-size:14.5px; margin-bottom:10px; display:flex; gap:10px; }
  .quiz-q-num{ font-family:var(--font-mono); color:var(--blue-deep); flex-shrink:0; }
  .option-btn-quiz{ padding:11px 15px; font-size:14px; }
  .feedback-inline{ margin-top:10px; font-size:13px; padding:10px 14px; border-radius:var(--radius-sm); color:var(--ink-soft); }
  .feedback-inline.feedback-correct{ background:var(--success-pale); }
  .feedback-inline.feedback-incorrect{ background:var(--danger-pale); }

  .module-nav{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }

  /* ---------- Exam ---------- */
  .exam-intro .panel-body{ text-align:center; }
  .exam-intro h1{ font-size:26px; }
  .exam-rules{ list-style:none; padding:0; margin:20px 0; text-align:left; display:flex; flex-direction:column; gap:10px; }
  .exam-rules li{ background:var(--paper); border-radius:var(--radius-sm); padding:12px 16px; font-size:14px; }
  .exam-best{ font-size:13.5px; color:var(--ink-soft); }
  .exam-intro .btn-primary{ display:flex; margin:18px auto 10px; }
  .exam-intro .btn-ghost{ display:flex; margin:0 auto; }

function eligiblePool(pool, tier){

    const rank = TIER_RANK[entry.difficulty] || 1;
    return rank <= maxRank;
  });
}

/* =========================================================
   UTILITÁRIOS GERAIS
   ========================================================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    const tmp=a[i]; a[i]=a[j]; a[j]=tmp;
  }
  return a;
}
function randInt(min, max){
  return Math.floor(Math.random()*(max-min+1))+min;
}
function choice(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}
function buildOptions(correctText, distractorTexts){
  const all = [correctText].concat(distractorTexts);
  const idxs = shuffle(all.map(function(_,i){ return i; }));
  const options = idxs.map(function(i){ return all[i]; });
  const correct = idxs.indexOf(0);
  return { options:options, correct:correct };
}
function escapeHtmlText(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlightPython(code){
  const escaped = String(code).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const pattern = /(#.*$)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(def|if|elif|else|for|while|return|True|False|None|and|or|not|in|import|from|as|class|try|except|break|continue|pass|is)\b|\b(print|input|range|len|append|type|int|float|str|bool)\b|\b(\d+\.?\d*)\b/gm;
  return escaped.replace(pattern, function(match, comment, string, keyword, builtin, number){
    if(comment !== undefined) return '<span class="tok-comment">'+comment+'</span>';
    if(string !== undefined) return '<span class="tok-string">'+string+'</span>';
    if(keyword !== undefined) return '<span class="tok-keyword">'+keyword+'</span>';
    if(builtin !== undefined) return '<span class="tok-builtin">'+builtin+'</span>';
    if(number !== undefined) return '<span class="tok-number">'+number+'</span>';
    return match;
  });
}
function renderCodeWithBlanksHTML(template, filled, checked, isCorrectAt){
  const highlighted = highlightPython(template);
  const parts = highlighted.split('@@');
  let html = '';
  parts.forEach(function(part, i){
    html += part;
    if(i < parts.length-1){
      const val = filled[i];
      let cls = 'blank-slot';
      if(val !== null && val !== undefined) cls += ' filled';
      if(checked) cls += (isCorrectAt(i) ? ' correct' : ' incorrect');
      html += '<span class="'+cls+'">'+(val !== null && val !== undefined ? escapeHtmlText(val) : '\u00A0\u00A0\u00A0\u00A0')+'</span>';
    }
  });
  return html;
}
function literalType(value){
  if(value === 'True' || value === 'False') return 'bool';
  if(typeof value === 'string' && value.length >= 2 && value.charAt(0) === '"' && value.charAt(value.length-1) === '"') return 'str';
  if(/^\d+\.\d+$/.test(value)) return 'float';
  if(/^\d+$/.test(value)) return 'int';
  return null;
}

const STR_CONTEXT_POOLS = {
  cidade: ['São Paulo','Rio de Janeiro','Curitiba','Salvador','Recife','Fortaleza','Belém','Manaus','Brasília','Porto Alegre'],
  nome: ['Ana','Léo','Bia','Rafa','Sofia','Théo','Mariana','Igor','Duda','Caio'],
  cor_favorita: ['azul','vermelho','verde','amarelo','roxo','preto','branco','laranja'],
  materia_favorita: ['Matemática','História','Português','Ciências','Geografia','Artes']
};
const STR_GENERIC_POOL = ['Python','café','livro','trem','filme','música','chuva','montanha'];
function randomLiteralOfType(type, tier, varName){
  if(type==='int'){
    if(tier==='facil') return String(randInt(1,20));
    if(tier==='dificil') return String(randInt(100,9999));
    return String(randInt(1,999));
  }
  if(type==='float'){
    if(tier==='facil') return (randInt(1,20) + choice([0.5,0.25])).toFixed(2);
    if(tier==='dificil') return (randInt(1,900) + choice([0.1,0.25,0.33,0.5,0.75,0.99])).toFixed(2);
    return (randInt(1,99) + choice([0.1,0.25,0.5,0.75,0.99])).toFixed(2);
  }
  if(type==='str'){
    const pool = (varName && STR_CONTEXT_POOLS[varName]) ? STR_CONTEXT_POOLS[varName] : STR_GENERIC_POOL;
    return '"'+choice(pool)+'"';
  }
  if(type==='bool') return choice(['True','False']);
  return '0';
}
function uniqueLiteral(type, usedSet, tier, varName){
  let val, guard = 0;
  do{ val = randomLiteralOfType(type, tier, varName); guard++; }while(usedSet.has(val) && guard < 25);
  usedSet.add(val);
  return val;
}

// Módulo 2 — Variáveis e Tipos
function genTypeQuestion(tier){
  tier = normTier(tier);
  const types = ['int','float','str','bool'];
  const labelMap = {int:'inteiro (int)', float:'decimal (float)', str:'texto (str)', bool:'booleano (bool)'};
  const target = choice(types);
  const used = new Set();
  const correctVal = uniqueLiteral(target, used, tier);
  const numDistractors = tier==='facil' ? 2 : 3;
  const distractorTypes = shuffle(types.filter(function(t){ return t!==target; })).slice(0, numDistractors);
  const distractors = distractorTypes.map(function(t){ return uniqueLiteral(t, used, tier); });
  if(tier==='dificil'){
    if(target==='int'){
      const sneaky = correctVal+'.0';
      if(!used.has(sneaky)){ distractors.push(sneaky); used.add(sneaky); }
    }else if(target==='float'){
      const intPart = correctVal.split('.')[0];
      if(!used.has(intPart)){ distractors.push(intPart); used.add(intPart); }
    }
  }
  const built = buildOptions(correctVal, distractors);
  return {
    q:'Qual das opções abaixo é um valor do tipo '+labelMap[target]+'?',
    options: built.options, correct: built.correct,
    explanation: correctVal+' é um valor do tipo '+labelMap[target]+'. Os outros valores pertencem a tipos diferentes — preste atenção às aspas, ao ponto decimal e a True/False.'
  };
}

function genArithmeticQuestion(tier){
  tier = normTier(tier);

    const used = new Set([correctVal]);
    const distractors = [];

      const v = candidates[i];
      if(v>=0 && !used.has(v)){ used.add(v); distractors.push(v); }
    }

      options: built.options, correct: built.correct,
      explanation:'Os parênteses definem a ordem: primeiro soma-se a + b = '+(a+b)+', e só depois calcula-se o resto da divisão por c: '+(a+b)+' % '+c+' = '+correctVal+'.'

  const allDistractors = [trueDiv+', '+mod, floorDiv+', '+(mod+1), (floorDiv+1)+', '+mod];
  const distractors = tier==='facil' ? allDistractors.slice(0,2) : allDistractors;
  const built = buildOptions(correctText, distractors);
  return {
    q:"Qual é o resultado das duas linhas, na ordem?",

    options: built.options, correct: built.correct,

function genRangeCountQuestion(tier){
  tier = normTier(tier);
  if(tier === 'dificil'){
    const start = randInt(0,3);
    const step = choice([2,3]);
    const iterations = randInt(3,6);
    const end = start + iterations*step;
    let simCount = 0, v = start;
    while(v < end){ simCount++; v += step; }
    const candidates = [simCount-1, simCount+1, Math.floor((end-start)/step)+2, step, end];
    const used = new Set([simCount]);
    const distractors = [];
    for(let i=0;i<candidates.length && distractors.length<3;i++){
      const c = candidates[i];
      if(c>=0 && !used.has(c)){ used.add(c); distractors.push(c); }
    }
    let fb = simCount+4;
    while(distractors.length<3){ if(!used.has(fb)){ used.add(fb); distractors.push(fb); } fb++; }
    const built = buildOptions(String(simCount), distractors.map(String));
    return {
      q:"Quantas vezes o laço abaixo executa o bloco?",
      code:'for i in range('+start+', '+end+', '+step+'):\n    print(i)',
      options: built.options, correct: built.correct,
      explanation:'Com passo '+step+', o laço vai de '+start+' em '+start+', '+ (start+step) +', '+(start+2*step)+'... sempre pulando de '+step+' em '+step+', até não passar de '+end+'. No total, são '+simCount+' repetições.'
    };
  }
  const start = tier==='facil' ? 0 : randInt(0,4);
  const end = tier==='facil' ? randInt(3,7) : randInt(start+2, start+9);
  const count = end-start;
  const candidates = [count-1, count+1, end, count+2, count-2, start, count*2];
  const used = new Set([count]);
  const distractors = [];
  for(let i=0;i<candidates.length && distractors.length<3;i++){
    const c = candidates[i];
    if(c>=0 && !used.has(c)){ used.add(c); distractors.push(c); }
  }
  let fallback = count+3;
  while(distractors.length<3){
    if(!used.has(fallback)){ used.add(fallback); distractors.push(fallback); }
    fallback++;
  }
  const built = buildOptions(String(count), distractors.map(String));
  return {
    q:"Quantas vezes o laço abaixo executa o bloco?",
    code:'for i in range('+start+', '+end+'):\n    print(i)',
    options: built.options, correct: built.correct,
    explanation:'range('+start+', '+end+') gera os números de '+start+' até '+(end-1)+' — isso são '+count+' valores.'
  };
}

      code:'def numero_eh_par(numero):\n    if numero % 2 == 0:\n        return True\n    else:\n        return False\n\ndef dobro(n):\n    return n * 2\n\nprint(numero_eh_par(dobro('+n+')))',
      options: built.options, correct: built.correct,
      explanation:'Primeiro dobro('+n+') é calculado: '+n+' * 2 = '+(n*2)+'. Esse resultado é sempre par, não importa o valor de n — por isso numero_eh_par(dobro('+n+')) sempre retorna True.'
    };
  }
  const n = tier==='facil' ? randInt(1,20) : randInt(1,80);
  const isEven = (n % 2 === 0);
  const built = buildOptions(String(isEven), [String(!isEven), 'None']);
  return {
    q:"O que numero_eh_par("+n+") retorna?",
    code:'def numero_eh_par(numero):\n    if numero % 2 == 0:\n        return True\n    else:\n        return False\n\nprint(numero_eh_par('+n+'))',
    options: built.options, correct: built.correct,
    explanation: n+' % 2 = '+(n%2)+(n%2===0 ? ', que é igual a 0 — o número é par, então a função retorna True.' : ', que é diferente de 0 — o número não é par, então a função retorna False.')
  };
}

/* =========================================================
   ARMAZENAMENTO (com fallback para localStorage)
   ---------------------------------------------------------
   Em produção dentro do Claude.ai, `window.storage` é a API nativa
   de artefatos (assíncrona, por usuário). Fora desse ambiente —
   por exemplo, ao publicar este arquivo no GitHub Pages ou abri-lo
   localmente — essa API não existe. Nesses casos, o AppStorage usa
   o localStorage do próprio navegador como alternativa, mantendo a
   mesma interface (get/set/delete) para o resto do código.
   ========================================================= */
const AppStorage = (function(){
  const hasNativeStorage = (typeof window !== 'undefined') && !!window.storage && typeof window.storage.get === 'function';
  const LS_PREFIX = 'logica_python__';
  const lsKey = function(key){ return LS_PREFIX + key; };
  const hasLocalStorage = (function(){
    try{
      if(typeof localStorage === 'undefined') return false;
      const testKey = '__logica_python_test__';
      localStorage.setItem(testKey, '1');
      localStorage.removeItem(testKey);
      return true;
    }catch(e){
      return false;
    }
  })();

  if(!hasNativeStorage){
    console.info('[logica-python] window.storage indisponível — usando localStorage como fallback.'+(hasLocalStorage ? '' : ' localStorage também indisponível: o progresso não será salvo nesta sessão.'));
  }

  return {
    backend: hasNativeStorage ? 'window.storage' : (hasLocalStorage ? 'localStorage' : 'nenhum'),
    async get(key, shared){
      if(hasNativeStorage) return window.storage.get(key, shared);
      if(!hasLocalStorage) throw new Error('Nenhum mecanismo de armazenamento disponível neste navegador.');
      const raw = localStorage.getItem(lsKey(key));
      if(raw === null) throw new Error('key not found');
      return { key:key, value:raw, shared:!!shared };
    },
    async set(key, value, shared){
      if(hasNativeStorage) return window.storage.set(key, value, shared);
      if(!hasLocalStorage) return null;
      localStorage.setItem(lsKey(key), value);
      return { key:key, value:value, shared:!!shared };
    },
    async delete(key, shared){
      if(hasNativeStorage) return window.storage.delete(key, shared);
      if(!hasLocalStorage) return null;
      localStorage.removeItem(lsKey(key));
      return { key:key, deleted:true, shared:!!shared };
    }
  };
})();

async function loadProgress(){
  initState();
  try{
    const result = await AppStorage.get('progresso', false);
    if(result && result.value){
      const saved = JSON.parse(result.value);
      if(typeof saved.xp === 'number') state.xp = saved.xp;
      if(saved.examBest) state.examBest = saved.examBest;
      if(saved.progress){
        Object.keys(saved.progress).forEach(function(idStr){
          const id = Number(idStr);
          if(state.progress[id]){
            const sp = saved.progress[idStr];
            state.progress[id].exerciseDone = !!sp.exerciseDone;
            state.progress[id].exerciseXpAwarded = !!sp.exerciseXpAwarded;
            state.progress[id].quizDone = !!sp.quizDone;
            if(sp.quizBestScore && typeof sp.quizBestScore.correct === 'number' && typeof sp.quizBestScore.total === 'number'){
              state.progress[id].quizBestScore = sp.quizBestScore;
            }
          }
        });
      }
    }
  }catch(e){
    /* sem progresso salvo ainda — começamos do zero */
  }
  state.view = 'home';
  render();
}

async function saveProgress(){
  try{
    await AppStorage.set('progresso', JSON.stringify({ xp:state.xp, examBest:state.examBest, progress:state.progress }), false);
  }catch(e){
    console.error('Erro ao salvar progresso', e);
  }
}

async function resetProgress(){
  if(!confirm('Tem certeza que deseja apagar todo o seu progresso? Essa ação não pode ser desfeita.')) return;
  try{ await AppStorage.delete('progresso', false); }catch(e){ /* ok se não existir */ }
  initState();
  state.view = 'home';
  render();
}

function getLevelInfo(xp){
  const levelIdx = Math.min(Math.floor(xp/100), LEVEL_TITLES.length-1);
  const xpIntoLevel = xp - levelIdx*100;
  const xpForNext = (levelIdx === LEVEL_TITLES.length-1) ? null : 100;
  return { level:levelIdx+1, title:LEVEL_TITLES[levelIdx], xpIntoLevel:xpIntoLevel, xpForNext:xpForNext };
}

/* =========================================================
   SESSÃO DE MÓDULO (sorteio de exercício + perguntas)
   ---------------------------------------------------------
   Cada vez que um módulo é aberto pela primeira vez nesta
   visita, sorteamos UM exercício do exercisePool e algumas
   perguntas do quizPool ELEGÍVEIS para a dificuldade atual
   (materializando geradores com o tier vigente). Esse sorteio
   fica fixo durante a sessão, até o usuário pedir novas
   perguntas, subir de dificuldade, ou até recarregar a página.
   ========================================================= */
function materialize(entry, tier){
  return (typeof entry === 'function') ? entry(tier) : entry;
}
function newModuleSession(moduleId){
  const m = MODULES.find(function(mm){ return mm.id===moduleId; });
  const tier = getDifficultyTier();
  const exPool = eligiblePool(m.exercisePool, tier);
  const exercise = materialize(choice(exPool), tier);
  const qzPool = eligiblePool(m.quizPool, tier);
  const drawCount = Math.min(getQuizDrawCount(tier), qzPool.length);
  const idxs = shuffle(qzPool.map(function(x,i){ return i; })).slice(0, drawCount);
  const quiz = idxs.map(function(i){ return materialize(qzPool[i], tier); });
  moduleSession[moduleId] = { exercise:exercise, quiz:quiz, quizAnswers:new Array(quiz.length).fill(null), tier:tier };
  return moduleSession[moduleId];
}
function getModuleSession(moduleId){
  if(!moduleSession[moduleId]) newModuleSession(moduleId);
  return moduleSession[moduleId];
}
function regenerateExercise(moduleId){
  const m = MODULES.find(function(mm){ return mm.id===moduleId; });
  const sess = getModuleSession(moduleId);
  const tier = getDifficultyTier();
  const exPool = eligiblePool(m.exercisePool, tier);
  sess.exercise = materialize(choice(exPool), tier);
  sess.tier = tier;
  delete exerciseUI[moduleId];
  render();
}
function regenerateQuiz(moduleId){
  const m = MODULES.find(function(mm){ return mm.id===moduleId; });
  const sess = getModuleSession(moduleId);
  const hasPartial = sess.quizAnswers.some(function(a){ return a!==null && a!==undefined; }) && !sess.quizAnswers.every(function(a){ return a!==null && a!==undefined; });
  if(hasPartial && !confirm('Isso vai sortear novas perguntas e descartar as respostas ainda não finalizadas desta prova rápida. Continuar?')) return;
  const tier = getDifficultyTier();
  const qzPool = eligiblePool(m.quizPool, tier);
  const drawCount = Math.min(getQuizDrawCount(tier), qzPool.length);
  const idxs = shuffle(qzPool.map(function(x,i){return i;})).slice(0, drawCount);
  sess.quiz = idxs.map(function(i){ return materialize(qzPool[i], tier); });
  sess.quizAnswers = new Array(sess.quiz.length).fill(null);
  sess.tier = tier;
  render();
}

   ========================================================= */
function getExUI(moduleId){
  if(!exerciseUI[moduleId]){
    const ex = getModuleSession(moduleId).exercise;
    if(ex.type === 'order'){
      exerciseUI[moduleId] = { shuffled:shuffle(ex.items.map(function(t,i){return i;})), placedIndices:[], checked:false, correct:null };
    }else if(ex.type === 'fill'){
      exerciseUI[moduleId] = { shuffledBank:shuffle(ex.wordBank.map(function(t,i){return i;})), filled:new Array(ex.correctAnswers.length).fill(null), usedBankIdx:[], checked:false, correct:null };
    }else if(ex.type === 'multiple' || ex.type === 'findbug'){
      exerciseUI[moduleId] = { selected:null, checked:false, correct:null };
    }else if(ex.type === 'codebuild'){
      exerciseUI[moduleId] = { shuffled:shuffle(ex.lines.map(function(t,i){return i;})), placedIndices:[], indents:[], checked:false, correct:null };
    }else if(ex.type === 'indent'){
      exerciseUI[moduleId] = { indents:new Array(ex.lines.length).fill(0), checked:false, correct:null };
    }
  }
  return exerciseUI[moduleId];
}
function markExerciseDone(moduleId){
  const p = state.progress[moduleId];
  p.exerciseDone = true;
  if(!p.exerciseXpAwarded){

}

  ui.usedBankIdx.push(bankIdx);

function codebuildRemove(moduleId, pos){
  const ui = getExUI(moduleId);
  if(ui.checked) return;

  ui.indents.splice(pos,1);

function codebuildSetIndent(moduleId, pos, level){
  const ui = getExUI(moduleId);
  if(ui.checked) return;
  ui.indents[pos] = level;

function codebuildReset(moduleId){

  ui.placedIndices = []; ui.indents = []; ui.checked=false; ui.correct=null;

function codebuildOrderValid(ex, placedIndices){
  if(placedIndices.length !== ex.lines.length) return false;
  const posOf = {};
  placedIndices.forEach(function(idx,pos){ posOf[idx]=pos; });
  return placedIndices.every(function(idx,pos){
    const deps = ex.lines[idx].dependsOn || [];
    return deps.every(function(depIdx){ return posOf[depIdx] !== undefined && posOf[depIdx] < pos; });
  });
}
function codebuildLinePositionOk(ex, placedIndices, pos){
  const idx = placedIndices[pos];
  const deps = ex.lines[idx].dependsOn || [];
  const posOf = {};
  placedIndices.forEach(function(pidx,p){ posOf[pidx]=p; });
  return deps.every(function(depIdx){ return posOf[depIdx] !== undefined && posOf[depIdx] < pos; });
}
function codebuildCheck(moduleId){
  const ui = getExUI(moduleId);
  const ex = getModuleSession(moduleId).exercise;
  ui.checked = true;
  const orderOk = codebuildOrderValid(ex, ui.placedIndices);
  let indentOk = true;
  if(ex.requireIndent){
    indentOk = ui.placedIndices.every(function(idx,pos){ return (ui.indents[pos]||0) === ex.lines[idx].indent; });
  }
  ui.correct = orderOk && indentOk;
  if(ui.correct) markExerciseDone(moduleId);
  render();
}
function renderIndentButtons(moduleId, pos, currentLevel, checked, setFnName){
  return '<div class="indent-controls">'+[0,1,2,3].map(function(lvl){
    return '<button class="indent-btn'+(currentLevel===lvl?' active':'')+'" onclick="'+setFnName+'('+moduleId+','+pos+','+lvl+')" '+(checked?'disabled':'')+' title="'+lvl+' nível(is) de indentação">'+lvl+'</button>';
  }).join('')+'</div>';
}
function renderCodebuildExercise(m){
  const ex = getModuleSession(m.id).exercise; const ui = getExUI(m.id);
  const poolHtml = ui.shuffled.filter(function(idx){ return ui.placedIndices.indexOf(idx)===-1; })
    .map(function(idx){ return '<button class="chip chip-mono" onclick="codebuildPick('+m.id+','+idx+')" '+(ui.checked?'disabled':'')+'>'+escapeHtmlText(ex.lines[idx].text)+'</button>'; }).join('');
  const rowsHtml = ui.placedIndices.map(function(idx,pos){
    const line = ex.lines[idx];
    let rowCls = 'codebuild-row';
    if(ui.checked){
      const posOk = codebuildLinePositionOk(ex, ui.placedIndices, pos);
      const indOk = !ex.requireIndent || ((ui.indents[pos]||0)===line.indent);
      rowCls += (posOk && indOk) ? ' correct' : ' incorrect';
    }
    const indentControls = ex.requireIndent ? renderIndentButtons(m.id, pos, ui.indents[pos]||0, ui.checked, 'codebuildSetIndent') : '';
    return '<div class="'+rowCls+'"><span class="codebuild-pos">'+(pos+1)+'.</span>'+indentControls+
      '<span class="codebuild-text" onclick="'+(ui.checked?'':'codebuildRemove('+m.id+','+pos+')')+'">'+escapeHtmlText(line.text)+'</span></div>';
  }).join('');
  const previewCode = ui.placedIndices.map(function(idx,pos){
    const lvl = ex.requireIndent ? (ui.indents[pos]||0) : 0;
    return '    '.repeat(lvl) + ex.lines[idx].text;
  }).join('\n');
  let feedback = '';
  if(ui.checked){
    feedback = '<div class="feedback '+(ui.correct?'feedback-correct':'feedback-incorrect')+'"><strong>'+(ui.correct?'✅ Perfeito! O código está correto.':'❌ Ainda não está certo.')+'</strong><p>'+ex.explanation+'</p>'+(!ui.correct?'<button class="btn-secondary" onclick="codebuildReset('+m.id+')">Tentar novamente</button>':'')+'</div>';
  }
  const allPlaced = ui.placedIndices.length === ex.lines.length;
  const hint = ex.requireIndent ? '<p class="codebuild-hint">Clique numa linha para adicioná-la e use os botões 0/1/2/3 para definir quantos níveis de indentação ela precisa (cada nível = 4 espaços). Quando algumas linhas não dependem umas das outras (como declarações de variáveis independentes), mais de uma ordem pode estar certa.</p>' : '<p class="codebuild-hint">Quando algumas linhas não dependem umas das outras (como declarações de variáveis independentes), mais de uma ordem pode estar certa — o importante é respeitar o que cada linha realmente precisa que já exista antes dela.</p>';
  return hint+
    '<div class="codebuild-rows">'+(rowsHtml || '<p class="placeholder-text">Clique nas linhas abaixo para começar a montar o código.</p>')+'</div>'+
    (ui.placedIndices.length ? '<pre class="code-block codebuild-preview">'+highlightPython(previewCode)+'</pre>' : '')+
    '<div class="order-pool">'+poolHtml+'</div>'+
    '<div class="exercise-actions">'+
      (!ui.checked ? '<button class="btn-primary" onclick="codebuildCheck('+m.id+')" '+(allPlaced?'':'disabled')+'>Verificar</button>' : '')+
      (ui.checked ? '' : '<button class="btn-ghost" onclick="codebuildReset('+m.id+')">Limpar</button>')+
    '</div>'+feedback;
}

/* ---- Indent exercise (só indentação, ordem já dada) ---- */
function indentSet(moduleId, pos, level){
  const ui = getExUI(moduleId);
  if(ui.checked) return;
  ui.indents[pos] = level;
  render();
}
function indentReset(moduleId){
  const ui = getExUI(moduleId);
  const ex = getModuleSession(moduleId).exercise;
  ui.indents = new Array(ex.lines.length).fill(0);
  ui.checked=false; ui.correct=null;
  render();
}
function indentCheck(moduleId){
  const ui = getExUI(moduleId);
  const ex = getModuleSession(moduleId).exercise;
  ui.checked = true;
  ui.correct = ex.lines.every(function(line,i){ return (ui.indents[i]||0)===line.indent; });
  if(ui.correct) markExerciseDone(moduleId);
  render();
}
function renderIndentExercise(m){
  const ex = getModuleSession(m.id).exercise; const ui = getExUI(m.id);
  const rowsHtml = ex.lines.map(function(line,i){
    let rowCls = 'codebuild-row';
    if(ui.checked) rowCls += ((ui.indents[i]||0)===line.indent) ? ' correct' : ' incorrect';
    const indentControls = renderIndentButtons(m.id, i, ui.indents[i]||0, ui.checked, 'indentSet');
    return '<div class="'+rowCls+'"><span class="codebuild-pos">'+(i+1)+'.</span>'+indentControls+'<span class="codebuild-text">'+escapeHtmlText(line.text)+'</span></div>';
  }).join('');
  const previewCode = ex.lines.map(function(line,i){ return '    '.repeat(ui.indents[i]||0) + line.text; }).join('\n');
  let feedback = '';
  if(ui.checked){
    feedback = '<div class="feedback '+(ui.correct?'feedback-correct':'feedback-incorrect')+'"><strong>'+(ui.correct?'✅ Indentação perfeita!':'❌ Alguma linha está com o nível errado.')+'</strong><p>'+ex.explanation+'</p>'+(!ui.correct?'<button class="btn-secondary" onclick="indentReset('+m.id+')">Tentar novamente</button>':'')+'</div>';
  }
  return '<p class="codebuild-hint">A ordem das linhas já está certa — use os botões 0/1/2/3 para definir quantos níveis de indentação (grupos de 4 espaços) cada linha precisa.</p>'+
    '<div class="codebuild-rows">'+rowsHtml+'</div>'+
    '<pre class="code-block codebuild-preview">'+highlightPython(previewCode)+'</pre>'+
    '<div class="exercise-actions">'+
      (!ui.checked ? '<button class="btn-primary" onclick="indentCheck('+m.id+')">Verificar</button>' : '')+
      (ui.checked ? '' : '<button class="btn-ghost" onclick="indentReset('+m.id+')">Limpar</button>')+
    '</div>'+feedback;
}

function renderExerciseWidget(m){
  const ex = getModuleSession(m.id).exercise;
  let inner = '';
  if(ex.type==='order') inner = renderOrderExercise(m);
  else if(ex.type==='fill') inner = renderFillExercise(m);
  else if(ex.type==='multiple') inner = renderMultipleExercise(m);
  else if(ex.type==='findbug') inner = renderFindbugExercise(m);

   ========================================================= */
function answerQuiz(moduleId, qIndex, optionIndex){
  const sess = getModuleSession(moduleId);
  if(sess.quizAnswers[qIndex] !== null && sess.quizAnswers[qIndex] !== undefined) return;
  sess.quizAnswers[qIndex] = optionIndex;
  const q = sess.quiz[qIndex];
  if(optionIndex === q.correct) addXP(10);
  const allAnswered = sess.quizAnswers.every(function(a){ return a!==null && a!==undefined; });
  if(allAnswered){
    const p = state.progress[moduleId];
    p.quizDone = true;
    const correctCount = sess.quizAnswers.filter(function(a,i){ return a===sess.quiz[i].correct; }).length;
    p.quizBestScore = { correct:correctCount, total:sess.quiz.length };
    saveProgress();
  }
  render();
}
function renderQuiz(m){
  const sess = getModuleSession(m.id);
  const questionsHtml = sess.quiz.map(function(q, qi){
    const answered = sess.quizAnswers[qi] !== null && sess.quizAnswers[qi] !== undefined;
    const codeHtml = q.code ? '<pre class="code-block">'+highlightPython(q.code)+'</pre>' : '';
    const optionsHtml = q.options.map(function(opt, oi){
      let cls = 'option-btn option-btn-quiz';
      if(answered){
        if(oi===q.correct) cls += ' correct';
        else if(oi===sess.quizAnswers[qi]) cls += ' incorrect';
      }
      return '<button class="'+cls+'" onclick="answerQuiz('+m.id+','+qi+','+oi+')" '+(answered?'disabled':'')+'>'+escapeHtmlText(opt)+'</button>';
    }).join('');
    const fb = answered ? '<div class="feedback-inline '+(sess.quizAnswers[qi]===q.correct?'feedback-correct':'feedback-incorrect')+'">'+(sess.quizAnswers[qi]===q.correct?'✅ ':'❌ ')+q.explanation+'</div>' : '';
    return '<div class="quiz-question"><p class="quiz-q-text"><span class="quiz-q-num">'+(qi+1)+'.</span><span>'+escapeHtmlText(q.q)+'</span></p>'+codeHtml+'<div class="options-list">'+optionsHtml+'</div>'+fb+'</div>';
  }).join('');
  return '<div class="quiz-panel"><div class="quiz-panel-head"><h3>📝 Prova Rápida do Módulo</h3>'+
    '<button class="btn-ghost btn-small" onclick="regenerateQuiz('+m.id+')" title="Sortear novas perguntas">🔄 Novas perguntas</button></div>'+
    questionsHtml+'</div>';
}

/* =========================================================
   PROVA FINAL
   ========================================================= */
function startExamIntro(){
  if(!allModulesDone()) return;
  state.view = 'exam';
  examState = { active:false };
  render();
  window.scrollTo(0,0);
}
function initExamBuildUI(qData){
  if(qData.type === 'codebuild'){
    return { shuffled: shuffle(qData.lines.map(function(t,i){ return i; })), placedIndices:[], indents:[] };
  } else if(qData.type === 'indent'){
    return { indents: new Array(qData.lines.length).fill(0) };
  }
  return null;
}
function beginExam(){
  const tier = getDifficultyTier();
  const pool = eligiblePool(EXAM_POOL, tier);
  const length = Math.min(getExamLength(tier), pool.length);
  const idxs = shuffle(pool.map(function(q,i){ return i; })).slice(0, length);
  const questions = idxs.map(function(i){ return materialize(pool[i], tier); });
  examState = { active:true, questions:questions, currentIndex:0, lives:3, score:0, xpEarned:0, answered:false, selected:null, timeLeft:EXAM_TIME, timerInterval:null, finished:false, tier:tier, buildUI:null };
  examState.buildUI = initExamBuildUI(questions[0]);
  render();
  startQuestionTimer();
}
function clearExamTimer(){
  if(examState && examState.timerInterval){ clearInterval(examState.timerInterval); examState.timerInterval = null; }
}
function startQuestionTimer(){
  clearExamTimer();
  examState.timeLeft = EXAM_TIME;
  const bar = document.getElementById('exam-timer-bar');
  if(bar){ bar.style.width='100%'; bar.classList.remove('timer-danger'); }
  examState.timerInterval = setInterval(function(){
    examState.timeLeft--;
    const b = document.getElementById('exam-timer-bar');
    if(b){
      b.style.width = (examState.timeLeft/EXAM_TIME*100)+'%';
      if(examState.timeLeft<=8) b.classList.add('timer-danger');
    }
    if(examState.timeLeft<=0){
      clearExamTimer();
      const qData = examState.questions[examState.currentIndex];
      if(qData.type==='codebuild' || qData.type==='indent'){
        examResolveAnswer(false, {timeout:true});
      }else{
        handleExamAnswer(-1);
      }
    }
  }, 1000);
}
function examResolveAnswer(isCorrect, meta){
  if(!examState || examState.answered) return;
  clearExamTimer();
  examState.answered = true;
  examState.lastCorrect = isCorrect;
  examState.selected = (meta && meta.selected !== undefined) ? meta.selected : null;
  examState.timedOut = !!(meta && meta.timeout);
  if(isCorrect){
    examState.score++;
    examState.xpEarned += 15;
    addXP(15);
  }else{
    examState.lives--;
  }
  render();
}
function handleExamAnswer(optionIndex){
  if(!examState || examState.answered) return;
  const qData = examState.questions[examState.currentIndex];
  const isCorrect = (optionIndex === qData.correct);
  examResolveAnswer(isCorrect, {selected: optionIndex, timeout: optionIndex===-1});
}
function examBuildPick(idx){
  if(!examState || examState.answered) return;
  const ui = examState.buildUI;
  if(ui.placedIndices.indexOf(idx) === -1){
    ui.placedIndices.push(idx);
    ui.indents.push(0);
  }
  render();
}
function examBuildRemove(pos){
  if(!examState || examState.answered) return;
  const ui = examState.buildUI;
  ui.placedIndices.splice(pos,1);
  ui.indents.splice(pos,1);
  render();
}
function examBuildSetIndent(_ignored, pos, level){
  if(!examState || examState.answered) return;
  examState.buildUI.indents[pos] = level;
  render();
}
function examIndentSet(_ignored, pos, level){
  if(!examState || examState.answered) return;
  examState.buildUI.indents[pos] = level;
  render();
}
function examBuildSubmit(){
  if(!examState || examState.answered) return;
  const qData = examState.questions[examState.currentIndex];
  const ui = examState.buildUI;
  let isCorrect = false;
  if(qData.type === 'codebuild'){
    const orderOk = ui.placedIndices.length===qData.lines.length && codebuildOrderValid(qData, ui.placedIndices);
    const indentOk = !qData.requireIndent || ui.placedIndices.every(function(idx,pos){ return (ui.indents[pos]||0) === qData.lines[idx].indent; });
    isCorrect = orderOk && indentOk;
  }else if(qData.type === 'indent'){
    isCorrect = qData.lines.every(function(line,i){ return (ui.indents[i]||0) === line.indent; });
  }
  examResolveAnswer(isCorrect, {});
}
function nextExamQuestion(){
  if(examState.lives<=0 || examState.currentIndex >= examState.questions.length-1){
    finishExam();
    return;
  }
  examState.currentIndex++;
  examState.answered = false;
  examState.selected = null;
  examState.buildUI = initExamBuildUI(examState.questions[examState.currentIndex]);
  render();
  startQuestionTimer();
}
function finishExam(){
  clearExamTimer();
  const total = examState.questions.length;
  const score = examState.score;
  const pct = Math.round((score/total)*100);
  let badge;
  if(pct>=90) badge = {emoji:'🏆', name:'Platina', title:'Mestre da Lógica'};
  else if(pct>=70) badge = {emoji:'🥇', name:'Ouro', title:'Programador(a) Afiado(a)'};
  else if(pct>=50) badge = {emoji:'🥈', name:'Prata', title:'Em Progresso'};
  else badge = {emoji:'🥉', name:'Bronze', title:'Continue Praticando'};
  const prevPct = state.examBest.total>0 ? (state.examBest.score/state.examBest.total) : -1;
  if((score/total) > prevPct){
    state.examBest = { score:score, total:total, badge:badge.emoji+' '+badge.name };
  }
  examState.finished = true;
  examState.finalPct = pct;
  examState.badge = badge;
  state.view = 'results';
  saveProgress();
  render();
  window.scrollTo(0,0);
  if(pct>=50) launchConfetti(pct>=90?100:60);
}
function renderExamIntro(){
  const tier = getDifficultyTier();
  const length = Math.min(getExamLength(tier), eligiblePool(EXAM_POOL, tier).length);
  return '<main class="content-shell content-shell-focus"><div class="panel exam-intro">'+
    '<div class="panel-chrome"><span class="dot dot-r"></span><span class="dot dot-y"></span><span class="dot dot-g"></span><span class="chrome-path">prova_final.py</span></div>'+
    '<div class="panel-body"><h1>🏆 Prova Final Gamificada</h1><p>Vamos testar tudo o que você aprendeu nos 8 módulos.</p>'+
    '<ul class="exam-rules">'+
      '<li>📈 Dificuldade atual: <strong>'+TIER_EMOJI[tier]+' '+TIER_LABEL[tier]+'</strong> (sobe conforme seu XP aumenta).</li>'+
      '<li>❤️ Você tem <strong>3 vidas</strong>. Cada resposta errada custa uma vida.</li>'+
      '<li>⏱️ <strong>'+EXAM_TIME+' segundos</strong> por pergunta — o tempo esgotado conta como erro.</li>'+
      '<li>🎯 <strong>'+length+' perguntas</strong> sorteadas de um banco maior (com perguntas geradas na hora) — cada tentativa é diferente.</li>'+
      (tier==='mestre' ? '<li>🧩 No nível Mestre, algumas perguntas pedem para <strong>montar o código</strong> ou <strong>acertar a indentação</strong>, em vez de escolher uma alternativa.</li>' : '')+
      '<li>⭐ +15 XP a cada resposta correta.</li>'+
    '</ul>'+
    (state.examBest.total>0 ? '<p class="exam-best">Sua melhor marca: <strong>'+state.examBest.score+'/'+state.examBest.total+'</strong> '+(state.examBest.badge||'')+'</p>' : '')+
    '<button class="btn-primary btn-large" onclick="beginExam()">Iniciar Prova →</button>'+
    '<button class="btn-ghost" onclick="goHome()">Voltar</button>'+
    '</div></div></main>';
}
function renderExamBuildQuestion(qData){
  const ui = examState.buildUI;
  const answered = examState.answered;
  if(qData.type === 'codebuild'){
    const poolHtml = ui.shuffled.filter(function(idx){ return ui.placedIndices.indexOf(idx)===-1; })
      .map(function(idx){ return '<button class="chip chip-mono" onclick="examBuildPick('+idx+')" '+(answered?'disabled':'')+'>'+escapeHtmlText(qData.lines[idx].text)+'</button>'; }).join('');
    const rowsHtml = ui.placedIndices.map(function(idx,pos){
      const line = qData.lines[idx];
      let rowCls = 'codebuild-row';
      if(answered){
        const posOk = codebuildLinePositionOk(qData, ui.placedIndices, pos);
        const indOk = !qData.requireIndent || ((ui.indents[pos]||0)===line.indent);
        rowCls += (posOk && indOk) ? ' correct' : ' incorrect';
      }
      const indentControls = qData.requireIndent ? renderIndentButtons(0, pos, ui.indents[pos]||0, answered, 'examBuildSetIndent') : '';
      return '<div class="'+rowCls+'"><span class="codebuild-pos">'+(pos+1)+'.</span>'+indentControls+
        '<span class="codebuild-text" onclick="'+(answered?'':'examBuildRemove('+pos+')')+'">'+escapeHtmlText(line.text)+'</span></div>';
    }).join('');
    const previewCode = ui.placedIndices.map(function(idx,pos){
      const lvl = qData.requireIndent ? (ui.indents[pos]||0) : 0;
      return '    '.repeat(lvl) + qData.lines[idx].text;
    }).join('\n');
    const allPlaced = ui.placedIndices.length === qData.lines.length;
    return '<p class="codebuild-hint">Clique nas linhas para montar o código'+(qData.requireIndent ? ' e use os botões 0/1/2/3 para a indentação de cada uma' : '')+'.</p>'+
      '<div class="codebuild-rows">'+(rowsHtml || '<p class="placeholder-text">Clique nas linhas abaixo para começar.</p>')+'</div>'+
      (ui.placedIndices.length ? '<pre class="code-block codebuild-preview">'+highlightPython(previewCode)+'</pre>' : '')+
      '<div class="order-pool">'+poolHtml+'</div>'+
      (!answered ? '<div class="exercise-actions"><button class="btn-primary" onclick="examBuildSubmit()" '+(allPlaced?'':'disabled')+'>Verificar</button></div>' : '');
  }
  // indent
  const rowsHtml = qData.lines.map(function(line,i){
    let rowCls = 'codebuild-row';
    if(answered) rowCls += ((ui.indents[i]||0)===line.indent) ? ' correct' : ' incorrect';
    const indentControls = renderIndentButtons(0, i, ui.indents[i]||0, answered, 'examIndentSet');
    return '<div class="'+rowCls+'"><span class="codebuild-pos">'+(i+1)+'.</span>'+indentControls+'<span class="codebuild-text">'+escapeHtmlText(line.text)+'</span></div>';
  }).join('');
  const previewCode = qData.lines.map(function(line,i){ return '    '.repeat(ui.indents[i]||0) + line.text; }).join('\n');
  return '<p class="codebuild-hint">A ordem já está certa — use os botões 0/1/2/3 para a indentação de cada linha.</p>'+
    '<div class="codebuild-rows">'+rowsHtml+'</div>'+
    '<pre class="code-block codebuild-preview">'+highlightPython(previewCode)+'</pre>'+
    (!answered ? '<div class="exercise-actions"><button class="btn-primary" onclick="examBuildSubmit()">Verificar</button></div>' : '');
}
function renderExamQuestion(){
  const qData = examState.questions[examState.currentIndex];
  const hearts = '❤️'.repeat(Math.max(examState.lives,0)) + '🖤'.repeat(Math.max(3-examState.lives,0));
  const isBuildType = (qData.type === 'codebuild' || qData.type === 'indent');
  const codeHtml = qData.code ? '<pre class="code-block">'+highlightPython(qData.code)+'</pre>' : '';
  let bodyHtml;
  if(isBuildType){
    bodyHtml = renderExamBuildQuestion(qData);
  }else{
    const optionsHtml = qData.options.map(function(opt,i){
      let cls = 'option-btn';
      if(examState.answered){
        if(i===qData.correct) cls += ' correct';
        else if(i===examState.selected) cls += ' incorrect';
      }
      return '<button class="'+cls+'" onclick="handleExamAnswer('+i+')" '+(examState.answered?'disabled':'')+'>'+escapeHtmlText(opt)+'</button>';
    }).join('');
    bodyHtml = '<div class="options-list">'+optionsHtml+'</div>';
  }
  const feedback = examState.answered ? '<div class="feedback '+(examState.lastCorrect?'feedback-correct':'feedback-incorrect')+'">'+
    '<strong>'+(examState.lastCorrect ? '✅ Correto!' : (examState.timedOut ? '⏱️ Tempo esgotado!' : '❌ Incorreto.'))+'</strong>'+
    '<p>'+qData.explanation+'</p>'+
    '<button class="btn-primary" onclick="nextExamQuestion()">'+((examState.currentIndex < examState.questions.length-1 && examState.lives>0) ? 'Próxima →' : 'Ver resultado →')+'</button>'+
  '</div>' : '';
  return '<main class="content-shell content-shell-focus">'+
    '<div class="exam-hud"><span class="exam-hearts">'+hearts+'</span><span class="exam-progress-text">Pergunta '+(examState.currentIndex+1)+'/'+examState.questions.length+'</span><span class="exam-score">Pontos: '+examState.score+'</span></div>'+
    '<div class="timer-track"><div id="exam-timer-bar" class="timer-fill" style="width:100%"></div></div>'+
    '<div class="panel"><div class="panel-body">'+codeHtml+'<p class="exam-question-text">'+escapeHtmlText(qData.q)+'</p>'+bodyHtml+'</div></div>'+
    feedback+
  '</main>';
}
function renderExamView(){
  if(!examState || !examState.active) return renderExamIntro();
  return renderExamQuestion();
}
function renderResultsView(){
  const b = examState.badge;
  return '<main class="content-shell content-shell-focus"><div class="panel results-panel"><div class="panel-body results-body">'+
    '<span class="results-badge-emoji">'+b.emoji+'</span><h1>'+b.name+'</h1><p class="results-title">'+b.title+'</p>'+
    '<p class="results-score">'+examState.score+'/'+examState.questions.length+' acertos ('+examState.finalPct+'%)</p>'+
    '<p class="results-xp">+'+examState.xpEarned+' XP nesta tentativa</p>'+
    (examState.lives<=0 ? '<p class="results-note">Você ficou sem vidas — mas pode tentar de novo quando quiser!</p>' : '')+
    '<div class="results-actions"><button class="btn-primary" onclick="startExamIntro()">Tentar novamente</button><button class="btn-ghost" onclick="goHome()">Voltar ao início</button></div>'+
  '</div></div></main>';
}

/* =========================================================
   RENDER PRINCIPAL
   ========================================================= */
function render(){
  const app = document.getElementById('app');
  if(!state || state.view==='loading'){
    app.innerHTML = '<div class="loading-screen"><div class="loading-glyph">$ iniciando guia<span class="loading-dots"></span></div></div>';
    return;
  }
  let body = '';
  if(state.view==='home') body = renderHome();
  else if(state.view==='module') body = renderModuleView();
  else if(state.view==='exam') body = renderExamView();
  else if(state.view==='results') body = renderResultsView();
  app.innerHTML = renderHeader() + body;
}

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
loadTheme();
loadProgress();
</script>
